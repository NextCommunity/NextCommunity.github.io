# https://github.com/j178/prek
name: 🔎 Prek - Audit Hooks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prek-audit:
    name: Prek Audit Hooks - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run prek-action
        uses: j178/prek-action@e98a699c41eb69ab013a45817a0406469a748f8d # v2.0.5
        with:
          install-only: true
      - name: Run manual prek hooks
        run: prek run --all-files --config .pre-commit-config-audit.yaml
