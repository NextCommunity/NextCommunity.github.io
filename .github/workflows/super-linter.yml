name: 🧪 Code Quality - Super-Linter

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    name: Super-Linter Validation
    runs-on: ubuntu-latest
    permissions:
      # contents permission to clone the repository
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false
      - name: Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          # Fork pull requests cannot write commit statuses; the workflow check
          # itself reports the lint result without making those API calls.
          MULTI_STATUS: false
          ERROR_ON_MISSING_EXEC_BIT: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_BIOME_LINT: true
          VALIDATE_BIOME_FORMAT: true
